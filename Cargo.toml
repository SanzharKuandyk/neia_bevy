[workspace]
members = [
    "neia_client",
    "neia_config",
    "neia_defaults",
    "neia_game",
    "neia_logic",
    "neia_mod",
    "neia_server",
    "neia_shared",
]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1.89"
hashbrown = "0.16.1"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.1", features = ["serde", "v4", "v5"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
